# Spieltags-Lauf: prognostiziert/versiegelt Spiele, deren Anstoß
# ins Tipp-Fenster fällt (config.yaml: timing), rechnet Enthülltes ab und
# trägt versiegelte Tipps bei Kicktipp ein.
#
# Reihenfolge ist Teil des Fairness-Mechanismus: erst versiegeln und den
# Hash-Beweis committen/pushen, DANN bei Kicktipp eintragen (aus den
# verschlüsselten .enc-Dateien). Schlägt die Abgabe fehl, existiert der
# öffentliche Beweis trotzdem schon - und der rote Lauf löst GitHubs
# Fehlerbenachrichtigung aus (concept.md §6).
name: Spieltag

on:
  # Bewusst KEIN GitHub-schedule: getaktet wird ausschließlich extern
  # (cron-job.org) per workflow_dispatch. GitHubs eigener Cron wird bei
  # Last stillschweigend verworfen - am 28.08.2026 feuerte er zwischen
  # 08:34 und 20:xx UTC gar nicht, wodurch das 4h-Tipp-Fenster für
  # Bayern-Stuttgart (Anstoß 18:30 UTC) ungenutzt verstrich.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-updates

jobs:
  spieltag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Prognose (Spiele im Tipp-Fenster)
        run: python -m engine.cli predict
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Versiegeln
        run: python -m engine.cli seal
        env:
          SEAL_SECRET: ${{ secrets.SEAL_SECRET }}

      # Paper-Kombiwette: eigenes 72h-Fenster (config.yaml: kombi), wird
      # direkt versiegelt - die Logs bleiben frei von Auswahl-Details.
      - name: Kombiwette (Paper, Kombi-Fenster)
        run: python -m engine.cli kombi
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEAL_SECRET: ${{ secrets.SEAL_SECRET }}

      # Saison-Bonusfragen: einmal pro Saison, Frist ist der erste Anstoß.
      # Läuft nach dem ersten Mal sofort wieder raus (Datei existiert schon).
      - name: Bonusfragen (Saisonwetten)
        run: python -m engine.cli bonus
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEAL_SECRET: ${{ secrets.SEAL_SECRET }}

      - name: Punkteabrechnung
        run: python -m engine.cli evaluate

      - name: Selbstlernen (Vertrauensregler, Quotengewicht)
        run: python -m engine.cli learn

      - name: Änderungen committen
        id: commit
        run: |
          git config user.name "der-automat[bot]"
          git config user.email "noreply@github.com"
          # data/ pauschal: explizite Pfade schlagen fehl, solange z.B.
          # data/sealed/ noch nicht existiert (cache/predictions sind gitignored)
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Spieltags-Update $(date -u '+%F %H:%M') UTC"
            push_with_retry() {
              for attempt in 1 2 3; do
                if git push; then return 0; fi
                if [ "$attempt" -eq 3 ]; then return 1; fi
                sleep $((attempt * 5))
                git pull --rebase origin main
              done
            }
            push_with_retry
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes mit GITHUB_TOKEN lösen keine push-Workflows aus,
      # deshalb wird der Site-Deploy explizit angestoßen.
      - name: Site-Deploy anstoßen
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy-site.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      # Kicktipp-Abgabe NACH dem Fairness-Commit; Browser-Arbeit nur, wenn
      # überhaupt versiegelte Tipps vorliegen (sonst endet der Lauf hier).
      # Auch die Bonusfragen zählen: sie werden über dieselbe Browser-Sitzung
      # eingetragen. Ohne sie hier würde der Schritt übersprungen, wenn gerade
      # keine Spieltipps offen sind - die Bonusantworten kämen nie an.
      - name: Prüfen, ob versiegelte Tipps vorliegen
        id: pending
        run: |
          if ls data/sealed/*.enc >/dev/null 2>&1 || ls data/bonus/*.enc >/dev/null 2>&1; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Playwright-Browser installieren
        if: steps.pending.outputs.pending == 'true'
        run: playwright install --with-deps chromium

      - name: Kicktipp-Tippabgabe (verifiziert, schlägt bei Anomalien fehl)
        if: steps.pending.outputs.pending == 'true'
        run: python -m engine.cli kicktipp
        env:
          KICKTIPP_EMAIL: ${{ secrets.KICKTIPP_EMAIL }}
          KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
          KICKTIPP_RUNDE: ${{ secrets.KICKTIPP_RUNDE }}
          SEAL_SECRET: ${{ secrets.SEAL_SECRET }}

      # Der Bot schreibt nach vollständigem Server-Rücklesen eine tippwertfreie
      # Quittung. Zweiter Commit bewusst nach der Abgabe: Der erste Commit oben
      # bleibt der zeitlich vorgelagerte Fairness-Beweis.
      - name: Bestätigte Kicktipp-Abgabe committen
        if: steps.pending.outputs.pending == 'true'
        run: |
          if [ ! -d data/submissions ]; then exit 0; fi
          git add data/submissions/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "der-automat[bot]"
          git config user.email "noreply@github.com"
          git commit -m "Kicktipp-Abgabe bestätigt $(date -u '+%F %H:%M') UTC"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done

      # Macht insbesondere einen verspäteten externen Trigger rot, wenn während
      # der Lücke ein Spiel ohne Versiegelung oder bestätigte Abgabe begann.
      - name: Abgabe- und Deadline-Audit
        run: python -m engine.cli audit
