# Konfiguration für "Der Automat"
#
# Aktiver Wettbewerb: Bundesliga 2026/27 (Regelbetrieb, 34 Spieltage,
# erster Anstoß 28.08.2026). Der vorherige WM-2026-Testbetrieb lief bis
# 19.07.2026; seine Daten bleiben unter data/ liegen (Beweiskette) und
# tauchen auf der Site nur noch im Archiv auf.
competition: bl1
# OpenLigaDB-Liga 'bl1', Saison-Schlüssel 2026 = Spielzeit 2026/27.
leagues: [bl1]
season: 2026
team_type: club # wählt den ELO-Adapter: club (clubelo.com) | national (eloratings.net)
neutral_venue: false # Liga: normaler Heimvorteil

kicktipp:
  # Punkteschema der Runde (Standard 4/3/2). Bei Unentschieden gibt es keine
  # Tordifferenz-Punkte, nur exakt oder Tendenz (Kicktipp-Standard).
  points:
    exact: 4
    goal_diff: 3
    tendency: 2
    # Zusatzfrage bei K.o.-Spielen: "Wer kommt weiter?" (0 = Runde wertet das
    # nicht). Wird separat ausgewiesen, nicht in points_total eingerechnet.
    advance: 2

model:
  # Zeitgewichtung: Gewicht = exp(-xi * Tage seit Spiel). 0.002/Tag ≈ Halbwertszeit ~1 Jahr.
  time_decay_xi: 0.002
  # L2-Regularisierung der Team-Parameter (hält Teams mit wenig Daten nahe am
  # Ligaschnitt), pro team_type: Nationalteams haben nur 3-7 Turnierspiele und
  # brauchen deutlich stärkere Shrinkage, sonst übertönen überangepasste
  # Team-Parameter den ELO-Term (im WM-Backtest gemessen: Plateau bei 5-12).
  # Vereine (60+ Spiele): flach zwischen 0.2 und 1.0.
  l2_penalty:
    club: 0.2
    national: 5.0
  # Tor-Raster der Wahrscheinlichkeitsmatrix: 0:0 bis 6:6
  max_goals: 6
  # Kandidaten-Tipps: 0..max_tip_goals pro Team
  max_tip_goals: 5
  elo:
    enabled: true
    # Prior für beta (log-Tor-Verhältnis pro 100 Punkte ELO-Differenz);
    # wird mitgeschätzt und zum Prior regularisiert
    beta_prior: 0.15
    beta_penalty: 50.0

# Buchmacherquoten als Live-Prior (concept.md §3). Kein historischer Endpunkt
# im Free Tier -> nur zur Vorhersagezeit angewendet (engine/market.py), nie im
# Backtest (dort bliebe der Quoten-Anteil sonst unfair "aus der Zukunft").
odds:
  enabled: true
  # Sport-Key von The Odds API - bei Wettbewerbswechsel prüfen/anpassen:
  # https://the-odds-api.com/liveapi/guides/v4/#sports
  sport_key: soccer_germany_bundesliga # WM: soccer_fifa_world_cup
  regions: eu
  # Gewicht der Marktquote beim Blend mit der Modellmeinung (1.0 = nur Markt)
  market_weight: 0.7

# Paper-Betting: rein theoretische 1X2-Wetten, keine echte Wettabgabe.
# Vorzug: Tipico DE. Falls nicht vorhanden, nutzt die Engine den Marktdurchschnitt
# aller von The Odds API gelieferten Bookmaker und weist die Quelle transparent aus.
paper_betting:
  enabled: true
  market: h2h_90min
  provider_preference:
    - tipico_de
  fallback: average_market
  staking:
    mode: fractional_kelly
    bankroll_eur: 1000
    kelly_fraction: 0.25
    max_stake_eur: 100
    min_edge: 0.02
    min_stake_eur: 0

  # Zweite, bewusst lockere Variante, die nur mitgeschrieben und bewertet wird
  # (wie die Schattentipper): Sie setzt auf JEDE Partie auf den Modell-Favoriten,
  # ohne Value-Prüfung, der Einsatz steigt mit der Zuversicht. Eigene Bankroll,
  # getrennte Bilanz. Zweck ist die Antwort auf eine Frage, die die strenge
  # Variante allein nicht beantworten kann: Bringt die Value-Regel über eine
  # Saison mehr, als einfach mitzuspielen? Die strenge Variante wettet dafür zu
  # selten (am 1. Spieltag 2 von 9 Partien), die lockere liefert ~306 Wetten.
  shadow:
    enabled: true
    label: locker
    staking:
      mode: confidence
      bankroll_eur: 1000
      min_stake_eur: 5 # bei <= confidence_from
      max_stake_eur: 25 # ab confidence_to
      confidence_from: 0.35 # bei drei Ausgängen kaum mehr als Zufall
      confidence_to: 0.70

# Paper-Kombiwette (engine/kombi.py): klassischer 2-3er-Akkumulator, rein
# theoretisch. Ein Bein qualifiziert sich nur, wenn es auch als Einzelwette
# Value hätte (rohe Modellwahrscheinlichkeit x Quote > 1) - sonst multipliziert
# sich statt der eigenen Edge die Buchmachermarge. Eigenes Fenster statt des
# 4h-Tipp-Fensters, weil in K.o.-Runden fast nie zwei Spiele gleichzeitig im
# Tipp-Fenster liegen. Höchstens eine offene Kombi zur Zeit; komplett
# versiegelt bis zum Anstoß des letzten Beins.
kombi:
  enabled: true
  # 24h statt der früheren 72h: Die 72 Stunden waren für K.o.-Runden gedacht, wo
  # selten zwei Spiele dicht beieinander liegen. Ein Bundesliga-Spieltag ist
  # ohnehin geballt - gemessen am echten Spielplan bleibt der Kandidatenpool im
  # Median bei 9 Spielen, während die Quoten-Abrufe von ~291 auf ~104 pro Monat
  # fallen (The Odds API Free Tier: 500/Monat). Ohne Kontingent liefe der
  # Automat still ohne Markt-Prior weiter - das stärkste Einzelsignal.
  window_hours: 24
  max_legs: 3
  min_leg_probability: 0.55 # "sicher": Bein braucht >= 55% Modellwahrscheinlichkeit
  min_leg_edge: 0.02
  staking:
    mode: fractional_kelly
    bankroll_eur: 1000
    kelly_fraction: 0.25
    min_stake_eur: 10 # unter 10 EUR Kelly-Einsatz gilt: nicht sicher genug, keine Kombi
    max_stake_eur: 100

# Saison-Bonusfragen der Kicktipp-Runde (engine/bonus.py): einmal pro Saison,
# Frist ist der erste Anstoß. Meister/Herbstmeister/Abstieg kommen aus einer
# Monte-Carlo-Saisonsimulation (engine/season.py), Torschützenkönig-Verein und
# erster Trainerwechsel vom LLM - dafür hat das Projekt keine Datenquelle.
# Wie Tipps und Kombi vollständig versiegelt bis zur Frist.
bonus:
  enabled: true
  # Erst ab diesem Zeitpunkt beantworten (UTC). Der Spielleiter stellt die
  # Rundenkonfiguration erst in der Woche vor Saisonstart fertig; eine zu früh
  # abgegebene Antwort müsste in Kicktipp von Hand zurückgesetzt werden, weil
  # der Bot bestehende Antworten nicht überschreibt. Frist ist der erste
  # Anstoß am 28.08. - drei Tage Puffer für Fehlschläge. Leer/entfernt =
  # sofort beim nächsten Lauf.
  answer_after: '2026-08-25T00:00:00Z'
  simulations: 10000 # Monte-Carlo-Durchläufe der Restsaison
  autumn_matchday: 17 # Herbstmeister = Tabellenführer nach diesem Spieltag
  points_per_answer: 4 # Punkteregel der Runde ("4 Punkte je richtiger Antwort")

llm:
  enabled: true
  provider: groq
  model: llama-3.3-70b-versatile
  # Schatten-Anpassungsvorschlag (concept.md Schicht 3, Teil 1): läuft NUR
  # geloggt/bewertet mit (siehe evaluate.py "llm_adjusted"), ändert NIE den
  # echten Tipp. Ob er irgendwann scharf geschaltet wird, entscheidet der
  # Vertrauensregler in engine/learn.py anhand der gesammelten Punkte.
  adjustment:
    enabled: true
    max_news_age_days: 5 # RSS-Schlagzeilen älter als das zählen nicht mehr

# Tipp-Timing: Spiele werden erst getippt/versiegelt/eingetragen, wenn ihr
# Anstoß höchstens tip_window_hours entfernt ist - so fließen tagesaktuelle
# News und Quotenbewegungen (z.B. kurzfristige Ausfälle) noch in den Tipp ein.
# Untergrenze safety_margin_minutes: so knapp vor (oder nach) Anstoß wird
# nicht mehr getippt - schützt den Fairness-Mechanismus (Tipp steht nachweislich
# vor Anstoß fest) und lässt der Kette predict->seal->commit->Kicktipp Luft.
# Fenstergröße ist an GitHubs Cron-Zuverlässigkeit bemessen (beobachtete
# Verspätungen bis ~2,5h): stündlicher Lauf + 4h-Fenster = ~4 Versuche pro Spiel.
timing:
  tip_window_hours: 4
  safety_margin_minutes: 20

# Kicktipp-Abgabe (concept.md Phase 4): trägt die Tipps automatisch bei
# kicktipp.de ein. Zugangsdaten und Rundenname kommen ausschließlich aus
# GitHub Actions Secrets (KICKTIPP_EMAIL/PASSWORD/RUNDE), nie hier - die
# Runde bleibt damit auch bei einem öffentlichen Repo nicht direkt auffindbar.
kicktipp_submission:
  enabled: true
  # Scharf geschaltet nach grünem Dry-Run gegen die Bundesliga-Runde am
  # 14.08.2026: Login, Rundennavigation, alle 9 Paarungen des 1. Spieltags
  # korrekt zugeordnet und alle 7 Bonus-Dropdowns richtig gesetzt.
  # Solange true: Formular wird nur ausgefüllt/screenshottet, nicht abgeschickt.
  dry_run: false

# Selbstlernen (concept.md Schicht 4 / Phase 5, engine/learn.py): bewusst
# konservative Mindest-Stichproben - bei der kleinen WM-Datenlage bleibt
# praktisch alles beim Default, der Mechanismus ist für die Bundesliga gebaut.
learning:
  enabled: true
  llm_trust:
    min_samples: 10 # abgerechnete Schatten-Anpassungen, bevor scharf geschaltet wird
    # Zusätzlich muss der Vorsprung im Schnitt so groß sein. Ohne diese Hürde
    # würde ein Gesamtsaldo von +1 Punkt aus zehn Anpassungen reichen, damit
    # das Sprachmodell echte, versiegelte Tipps überschreibt - bei zehn Spielen
    # ist das nicht von Zufall zu unterscheiden.
    min_points_per_adjustment: 1.0
  market_weight:
    min_samples: 20    # Spiele mit Quote+Rohmodell+Ergebnis, bevor gelernt wird
    pseudo_samples: 20 # Regularisierung Richtung odds.market_weight

backtest:
  # Vereinsfußball: rollierend über die letzten 3 Bundesliga-Saisons
  club:
    competition: bl1
    leagues: [bl1]
    seasons: [2023, 2024, 2025]
    lookback_seasons: 2 # Vorsaisons als Trainings-Warmup
    team_type: club
    neutral_venue: false
  # WM 2026: Gruppenphase + bisherige K.o.-Spiele als Out-of-Sample-Test
  national:
    competition: wm26
    leagues: [wm26]
    season: 2026
    team_type: national
    neutral_venue: true
